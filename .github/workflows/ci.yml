name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: vayu, POSTGRES_PASSWORD: vayu, POSTGRES_DB: vayu}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayu" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy apps vayu
      - run: uv run python manage.py makemigrations --check --dry-run
        env: {DJANGO_SETTINGS_MODULE: vayu.settings.test}
      - run: uv run pytest --cov --cov-fail-under=85
      - name: critical areas need 100% branch coverage
        run: |
          uv run pytest -q apps/forms --cov=apps.forms.rules --cov-branch --cov-fail-under=100
          uv run pytest -q apps/bookings apps/forms/tests/test_access_model.py --cov=apps.bookings --cov=apps.forms.access --cov-branch --cov-fail-under=100
          uv run pytest -q apps/accounts --cov=apps.accounts.permissions --cov=apps.accounts.roles --cov-branch --cov-fail-under=100
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vayu-api backend
      - name: image runs as a non-root user
        run: test "$(docker run --rm vayu-api id -u)" != "0"
      - name: image uses its own venv (not one copied from the host)
        run: docker run --rm vayu-api sh -c 'test "$(which python)" = /app/.venv/bin/python'
