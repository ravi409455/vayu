name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: vayu, POSTGRES_PASSWORD: vayu, POSTGRES_DB: vayu}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayu" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - name: PDF system libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy apps vayu
      - run: uv run python manage.py makemigrations --check --dry-run
        env: {DJANGO_SETTINGS_MODULE: vayu.settings.test}
      - name: the committed OpenAPI file matches the code
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml
          diff openapi.yaml /tmp/openapi.yaml || (echo "Run: cd backend && DJANGO_SETTINGS_MODULE=vayu.settings.test uv run python manage.py spectacular --file openapi.yaml" && exit 1)
        env: {DJANGO_SETTINGS_MODULE: vayu.settings.test}
      - name: no breaking API changes (oasdiff)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="origin/$BASE_REF"; else base="HEAD~1"; fi
          if git cat-file -e "$base:backend/openapi.yaml" 2>/dev/null; then
            git show "$base:backend/openapi.yaml" > /tmp/base.yaml
            cp openapi.yaml /tmp/new.yaml
            docker run --rm -v /tmp:/t tufin/oasdiff breaking /t/base.yaml /t/new.yaml --fail-on ERR
          else echo "no earlier schema to compare with"; fi
      - run: uv run pytest --cov --cov-fail-under=85
      - name: critical areas need 100% branch coverage
        run: |
          uv run pytest -q apps/forms --cov=apps.forms.rules --cov-branch --cov-fail-under=100
          uv run pytest -q apps/bookings apps/forms/tests/test_access_model.py --cov=apps.bookings --cov=apps.forms.access --cov-branch --cov-fail-under=100
          uv run pytest -q apps/media --cov=apps.media --cov-branch --cov-fail-under=100
          uv run pytest -q apps/reports --cov=apps.reports --cov-branch --cov-fail-under=100
          uv run pytest -q apps/forms/tests/test_promote.py apps/forms/tests/test_builder_support.py apps/forms/tests/test_system_forms.py --cov=apps.forms.promote --cov-branch --cov-fail-under=100
          uv run pytest -q apps/scoring apps/bookings/tests/test_scoring.py --cov=apps.scoring --cov-branch --cov-fail-under=100
          uv run pytest -q apps/integrations --cov=apps.integrations --cov-branch --cov-fail-under=100
          uv run pytest -q apps/accounts --cov=apps.accounts.permissions --cov=apps.accounts.roles --cov-branch --cov-fail-under=100
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: vayu, POSTGRES_PASSWORD: vayu, POSTGRES_DB: vayu_e2e}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayu" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - name: PDF system libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: browser journeys J1-J5 (real API, fake S3, real browser)
        run: npx playwright test
        working-directory: web
        env: {CI: "true"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: "web/test-results", retention-days: 7}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vayu-api backend
      - name: image runs as a non-root user
        run: test "$(docker run --rm vayu-api id -u)" != "0"
      - name: image uses its own venv (not one copied from the host)
        run: docker run --rm vayu-api sh -c 'test "$(which python)" = /app/.venv/bin/python'
      - name: image can render a PDF (system libraries present)
        run: docker run --rm vayu-api python -c "from weasyprint import HTML; assert HTML(string='<p>x</p>').write_pdf()[:4] == b'%PDF'"
