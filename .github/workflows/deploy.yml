name: deploy
# How a release travels (docs/plan-deploy.md Phase 4):
#   CI passes on main → build the API and web images ONCE, labelled with the commit id →
#   staging deploys by itself → production waits for the owner's Approve (environment
#   "production" has a required reviewer) and deploys the SAME images.
# Rollback: Actions → deploy → Run workflow → the commit id to go back to (its images already exist).
# Every merge to main builds and deploys (docs-only too: a shortcut once skipped a code release).
# Never runs for pull requests: only after CI on a push to main, or by hand.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit id on main to deploy (its images must exist, i.e. it was built before)
        required: true
permissions: {contents: read}
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      sha: ${{ steps.what.outputs.sha }}
      deploy: ${{ steps.what.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: what to deploy
        id: what
        env:
          EVENT: ${{ github.event_name }}
        # Every merge builds and deploys, docs-only ones too. A "docs only, skip" shortcut once
        # skipped a code release: CI on main cancels an older run when a newer merge arrives, so the
        # code merge never deployed and the docs merge after it deployed nothing. A docs merge costs
        # a cached build and a 10-20 s restart of staging. A hand-started run builds as well (same
        # commit, same images; cheap when they exist, needed when they don't).
        run: |
          { echo "sha=$(git rev-parse HEAD)"; echo "deploy=true"; echo "build=true"; } >> "$GITHUB_OUTPUT"
          echo "event: $EVENT"
      - if: steps.what.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.what.outputs.build == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image (API, workers, scheduler)
        if: steps.what.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/vayu-api:${{ steps.what.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: web image (Caddy + the web app; one image for staging and production)
        if: steps.what.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/vayu-web:${{ steps.what.outputs.sha }}
          # the web DSN is public by nature (every browser sees it): a repo variable, not a secret
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_RELEASE=${{ steps.what.outputs.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
          # source maps go to Sentry and are deleted from the image (no token: no maps at all)
          secrets: |
            sentry_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  staging:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: {name: staging, url: "https://vayu-staging.carcid.in"}
    # one staging deploy at a time. A running deploy is never cut off (deploy.sh would stop
    # half-way on the server); of the runs waiting behind it GitHub keeps only the newest.
    concurrency: {group: deploy-staging, cancel-in-progress: false}
    steps:
      - &ssh-deploy
        name: deploy over SSH (the key can only run infra/deploy.sh <commit>)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SHA: ${{ needs.build.outputs.sha }}
          # started by hand = a rollback, which may go back to an older commit; a merge never does
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'rollback' || '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts   # the server's own key: no man in the middle
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "deploy@$SSH_HOST" "$SHA${MODE:+ $MODE}" \
            || { echo "::error::Deploy failed. Staging is on demand: if it is off, run infra/staging.sh up, then this workflow again."; exit 1; }

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: {name: production, url: "https://vayu.carcid.in"}   # waits for the owner's Approve
    # its own queue: a run waiting for Approve no longer holds up the next staging deploy
    concurrency: {group: deploy-production, cancel-in-progress: false}
    steps:
      - *ssh-deploy
