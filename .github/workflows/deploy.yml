name: deploy
# How a release travels (docs/plan-deploy.md Phase 4):
#   CI passes on main → build the API and web images ONCE, labelled with the commit id →
#   staging deploys by itself → production waits for the owner's Approve (environment
#   "production" has a required reviewer) and deploys the SAME images.
# Rollback: Actions → deploy → Run workflow → the full commit id to go back to (must be on main;
# its images are reused, never rebuilt).
# The newest merge always deploys, whatever files it changed. When merges come close together,
# CI cancels the older run and only the newest deploys; it contains every earlier change.
# Never runs for pull requests: only after CI on a push to main, or by hand.
# the title in the Actions list: what this run deploys, or why it deployed nothing
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Rollback to {0}', inputs.commit)
  || github.event.workflow_run.conclusion != 'success' && format('Skipped (CI {0}): {1}', github.event.workflow_run.conclusion, github.event.workflow_run.display_title)
  || format('Deploy: {0}', github.event.workflow_run.display_title) }}
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit id on main to deploy (its images must exist, i.e. it was built before)
        required: true
permissions: {contents: read}
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # a run with nothing to deploy says why on its page (no machine time beyond a few seconds)
  skipped:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: say why nothing was deployed
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$CONCLUSION" in
            cancelled) why="CI on main was cancelled (a newer merge replaced it; that merge deploys instead, with every change in this one)." ;;
            failure)   why="CI on main failed, so nothing was built or deployed. Fix it and merge again." ;;
            *)         why="CI on main ended as \"$CONCLUSION\"." ;;
          esac
          echo "### Nothing deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$why [The CI run]($CI_URL)" >> "$GITHUB_STEP_SUMMARY"

  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      sha: ${{ steps.what.outputs.sha }}
      deploy: ${{ steps.what.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: what to deploy
        id: what
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # The newest merge always deploys, docs-only too. A "docs only, skip" shortcut once skipped a code
        # release: CI on main cancels an older run when a newer merge arrives, so the code merge
        # never deployed and the docs merge after it deployed nothing.
        # A hand-started run (rollback) only takes a full commit id that is already on main,
        # checked here before anything is built or pushed.
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{40}$ && "$INPUT_COMMIT" == "$sha" ]] \
              || { echo "::error::give the full 40-character commit id"; exit 1; }
            status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status)
            [[ "$status" == ahead || "$status" == identical ]] \
              || { echo "::error::$sha is not on main"; exit 1; }
          fi
          { echo "sha=$sha"; echo "deploy=true"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: images already built? (they are never rebuilt or overwritten)
        id: images
        env:
          SHA: ${{ steps.what.outputs.sha }}
        run: |
          if docker buildx imagetools inspect "$REGISTRY/vayu-api:$SHA" >/dev/null 2>&1 \
              && docker buildx imagetools inspect "$REGISTRY/vayu-web:$SHA" >/dev/null 2>&1; then
            echo "Images for $SHA exist: deploying them as they are."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: API image (API, workers, scheduler)
        if: steps.images.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/vayu-api:${{ steps.what.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: ${{ github.event_name == 'workflow_run' && 'type=gha,mode=max,scope=api' || '' }}   # only merges to main write the cache
      - name: web image (Caddy + the web app; one image for staging and production)
        if: steps.images.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/vayu-web:${{ steps.what.outputs.sha }}
          # the web DSN is public by nature (every browser sees it): a repo variable, not a secret
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_RELEASE=${{ steps.what.outputs.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
          # source maps go to Sentry and are deleted from the image (no token: no maps at all)
          secrets: |
            sentry_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: ${{ github.event_name == 'workflow_run' && 'type=gha,mode=max,scope=web' || '' }}
      - name: summary
        env:
          SHA: ${{ steps.what.outputs.sha }}
          BUILT: ${{ steps.images.outputs.build }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'Rollback to' || 'Deploy' }}
        run: |
          {
            echo "### $MODE ${SHA::7}: $(git log -1 --format=%s)"
            echo "| Step | Result |"
            echo "|---|---|"
            if [ "$BUILT" = true ]; then echo "| Images | built new: vayu-api, vayu-web :${SHA::7} |"
            else echo "| Images | reused (built before): vayu-api, vayu-web :${SHA::7} |"; fi
            echo "| Staging | deploys next, by itself |"
            echo "| Production | waits for your Approve (the Review deployments button on this page) |"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: {name: staging, url: "https://vayu-staging.carcid.in"}
    # one staging deploy at a time. A running deploy is never cut off (deploy.sh would stop
    # half-way on the server); of the runs waiting behind it GitHub keeps only the newest.
    concurrency: {group: deploy-staging, cancel-in-progress: false}
    steps:
      - &ssh-deploy
        name: deploy over SSH (the key can only run infra/deploy.sh <commit>)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SHA: ${{ needs.build.outputs.sha }}
          # started by hand = a rollback, which may go back to an older commit; a merge never does
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'rollback' || '' }}
          WHERE: ${{ github.job }}
        run: |
          case "$WHERE" in staging) url=https://vayu-staging.carcid.in ;; *) url=https://vayu.carcid.in ;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts   # the server's own key: no man in the middle
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "deploy@$SSH_HOST" "$SHA${MODE:+ $MODE}" \
            || { echo "::error::Deploy failed. Staging is on demand: if it is off, run infra/staging.sh up, then this workflow again."
                 echo "### ✗ $WHERE: deploy of ${SHA::7} failed (see the log of this job)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "### ✓ $WHERE: ${SHA::7} is live on $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: {name: production, url: "https://vayu.carcid.in"}   # waits for the owner's Approve
    # its own queue: a run waiting for Approve no longer holds up the next staging deploy
    concurrency: {group: deploy-production, cancel-in-progress: false}
    steps:
      - *ssh-deploy
