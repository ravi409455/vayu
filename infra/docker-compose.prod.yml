# Used for production AND staging; the difference is the env file (--env-file).
# Usage: docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d
services:
  api:
    build: ../backend
    restart: always
    env_file: ../.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: inspex.settings.prod
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    command: >
      sh -c "uv run --no-dev python manage.py migrate --noinput &&
             uv run --no-dev gunicorn inspex.wsgi -b 0.0.0.0:8000 -w 4 --access-logfile -"
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: ../.env.prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: always
    volumes: ["redisdata:/data"]
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    environment:
      APP_HOST: ${APP_HOST}
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
  caddydata:
