# Local dev/test services. Prod + staging compose files come with the deploy task.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vayu
      POSTGRES_PASSWORD: vayu
      POSTGRES_DB: vayu
    ports: ["127.0.0.1:5432:5432"]  # never expose the dev DB to the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayu"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
