<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- what a shared report link previews as (WhatsApp runs no script); staff pages set their own title -->
    <title>Car C.I.D.</title>
    <meta name="description" content="Car C.I.D. car inspection report." />
    <meta property="og:title" content="Car C.I.D." />
    <meta property="og:description" content="Car C.I.D. car inspection report." />
    <meta property="og:site_name" content="Car C.I.D." />
    <link rel="icon" type="image/png" href="/carcid-logo.png" />
    <script>
      // Paint the saved look before the app loads (no flash). Signed-out pages stay Light.
      try {
        var p = location.pathname, t = localStorage.getItem("vayu:theme");
        if (p !== "/login" && p.indexOf("/verify") !== 0 && p.indexOf("/zip") !== 0 && (t === "light" || t === "dark" || t === "system")) {
          var d = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
          document.documentElement.dataset.theme = d;
          document.documentElement.style.colorScheme = d;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
