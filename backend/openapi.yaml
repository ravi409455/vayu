          type: array
          items:
            type: string
        url:
          type: string
        min_version:
          type: integer
      required:
      - min_version
      - version_code
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
        actor_username:
          type: string
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 64
        target_type:
          type: string
          maxLength: 64
        target_id:
          type: string
          maxLength: 64
        summary:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - action
      - actor_name
      - actor_username
      - id
      - summary
      - target_id
      - target_type
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type: string
          maxLength: 64
        stage:
          $ref: '#/components/schemas/StageEnum'
        ops_status:
          type: string
          maxLength: 64
        inspection_type:
          type: string
          maxLength: 64
        assigned_expert:
          type: integer
          nullable: true
        answers: {}
        row_version:
          type: integer
          maximum: 2147483647
          minimum: 0
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
        cancel_reason:
          type: string
          maxLength: 64
        released_by:
          type: string
        released_draft_expected:
          type: boolean
        last_edited_by:
          type: string
        last_edited_at:
          type: string
          format: date-time
          nullable: true
        reschedules:
          type: array
          items:
            $ref: '#/components/schemas/Reschedule'
          readOnly: true
        created_at:
          type: string
          format: date-time
        conflict:
          type: string
          maxLength: 40
        alerts: {}
        withdrawn_expert:
          type: integer
          nullable: true
        unverified_time:
          type: boolean
      required:
      - booking_id
      - finished_at
      - id
      - reschedules
    Check:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rule: {}
        message:
          type: string
          maxLength: 300
        fields: {}
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - id
      - message
      - rule
    ClientEnum:
      enum:
      - web
      - mobile
      type: string
      description: |-
        * `web` - web
        * `mobile` - mobile
    DeviceCheckedRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    Field:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        section:
          type: integer
        key:
          type: string
          maxLength: 63
        label:
          type: string
          maxLength: 200
        helper_text:
          type: string
        type:
          $ref: '#/components/schemas/FieldTypeEnum'
        config: {}
        required:
          type: boolean
        required_if:
          nullable: true
        show_if:
          nullable: true
        visible:
          type: boolean
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_system:
          type: boolean
          readOnly: true
        access: {}
        library:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        locked:
          type: boolean
          readOnly: true
