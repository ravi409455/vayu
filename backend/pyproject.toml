[project]
name = "vayu-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django~=5.2",
  "djangorestframework~=3.16",
  "djangorestframework-simplejwt~=5.5",
  "psycopg[binary]~=3.2",
  "redis>=6.1,<7",
  "sentry-sdk~=2.20",
  "python-json-logger~=3.2",
  "gunicorn>=27.0.1",
  "jsonlogic-rs==0.5.0",
  "regex>=2026.11.19",
  "boto3>=1.44.9",
  "celery>=5.7.0",
  "pillow>=13.0.0",
  "weasyprint>=70.0",
  "qrcode>=8.2",
  "jinja2>=3.1.6",
  "drf-spectacular>=0.30.0",
  "requests>=2.34.2",
  "jsonschema>=4.23",
  "nh3>=0.2.18",
  "cryptography>=44",
  "pillow-heif>=1.9.0",
  "pypdf>=7.1.1",
  "pyjwt>=2.8",
  # kombu 5.7 (Celery's Redis transport) imports it without declaring it: without this line every
  # worker in the production image crashes at start (found in the deploy rehearsal)
  "packaging>=24",
]

[dependency-groups]
dev = [
  "pytest~=8.3",
  "pytest-django~=4.10",
  "pytest-cov~=6.0",
  "freezegun~=1.5",
  "hypothesis~=6.120",
  "ruff~=0.9",
  "mypy~=1.14",
  "django-stubs[compatible-mypy]~=5.1",
  "djangorestframework-stubs[compatible-mypy]~=3.15",
  "moto[s3,server]>=5.2.5",
  "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vayu.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "C90"]
ignore = ["DJ008"]  # no Django admin, so no __str__ boilerplate

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501", "F811", "S101", "S105", "S106", "S107"]  # F811: fixtures imported, used by name; S: asserts and test passwords
"apps/reports/render.py" = ["E501", "C901"]  # embedded CSS/HTML
"apps/platform/demo_forms.py" = ["E501"]  # a data table
# Complexity allow list (C901, max 12; render.py is above): it only shrinks. Split a function, then drop its line.
"apps/bookings/submissions.py" = ["C901"]
"apps/bookings/views.py" = ["C901"]
"apps/forms/library.py" = ["C901"]
"apps/forms/promote.py" = ["C901"]
"apps/forms/rules.py" = ["C901"]
"apps/forms/services.py" = ["C901"]
"apps/integrations/values.py" = ["C901"]
"apps/integrations/serializers.py" = ["C901"]
"apps/media/services/uploads.py" = ["C901"]
"apps/platform/demo_pdi.py" = ["C901"]
"apps/platform/setup/clappia.py" = ["C901"]
"apps/platform/setup/testdata.py" = ["C901"]
"apps/reports/context.py" = ["C901"]
"apps/reports/definition.py" = ["C901"]
"apps/scoring/engine.py" = ["C901"]
"apps/scoring/keychecks.py" = ["C901"]
"apps/scoring/service.py" = ["C901"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

# typed code (plan-quality Q1.2): core, every app's services, the library and integrations
# The strict flags one by one: `strict = true` in an override leaks to every module, and
# disallow_untyped_decorators is left off because Celery's @shared_task is untyped.
[[tool.mypy.overrides]]
module = ["apps.core.*", "apps.*.services", "apps.*.services.*", "apps.forms.library",
          "apps.forms.library_push", "apps.integrations.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apps.*.tests.*", "apps.*.migrations.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false

[tool.django-stubs]
django_settings_module = "vayu.settings.test"

[tool.coverage.run]
source = ["apps", "vayu"]
omit = ["*/migrations/*", "*/tests/*"]
