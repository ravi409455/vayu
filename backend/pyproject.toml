[project]
name = "inspex-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django~=5.2",
  "djangorestframework~=3.16",
  "djangorestframework-simplejwt~=5.5",
  "psycopg[binary]~=3.2",
  "redis~=5.2",
  "sentry-sdk~=2.20",
  "python-json-logger~=3.2",
  "gunicorn>=27.0.1",
]

[dependency-groups]
dev = [
  "pytest~=8.3",
  "pytest-django~=4.10",
  "pytest-cov~=6.0",
  "factory-boy~=3.3",
  "freezegun~=1.5",
  "hypothesis~=6.120",
  "ruff~=0.9",
  "mypy~=1.14",
  "django-stubs[compatible-mypy]~=5.1",
  "djangorestframework-stubs[compatible-mypy]~=3.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "inspex.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "inspex.settings.test"

[tool.coverage.run]
source = ["apps", "inspex"]
omit = ["*/migrations/*", "*/tests/*"]
