[project]
name = "vayu-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django~=5.2",
  "djangorestframework~=3.16",
  "djangorestframework-simplejwt~=5.5",
  "psycopg[binary]~=3.2",
  "redis>=6.1,<7",
  "sentry-sdk~=2.20",
  "python-json-logger~=3.2",
  "gunicorn>=27.0.1",
  "jsonlogic-rs==0.5.0",
  "regex>=2026.11.19",
  "boto3>=1.44.9",
  "celery>=5.7.0",
  "pillow>=13.0.0",
  "weasyprint>=70.0",
  "qrcode>=8.2",
  "jinja2>=3.1.6",
  "drf-spectacular>=0.30.0",
  "requests>=2.34.2",
  "jsonschema>=4.23",
  "nh3>=0.2.18",
  "cryptography>=44",
  "pillow-heif>=1.9.0",
  "pypdf>=7.1.1",
  "pyjwt>=2.8",
]

[dependency-groups]
dev = [
  "pytest~=8.3",
  "pytest-django~=4.10",
  "pytest-cov~=6.0",
  "freezegun~=1.5",
  "hypothesis~=6.120",
  "ruff~=0.9",
  "mypy~=1.14",
  "django-stubs[compatible-mypy]~=5.1",
  "djangorestframework-stubs[compatible-mypy]~=3.15",
  "moto[s3,server]>=5.2.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vayu.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ008"]  # no Django admin, so no __str__ boilerplate

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501", "F811"]  # F811: fixtures imported, used by name
"apps/reports/render.py" = ["E501"]  # embedded CSS/HTML
"apps/core/demo_forms.py" = ["E501"]  # a data table

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "vayu.settings.test"

[tool.coverage.run]
source = ["apps", "vayu"]
omit = ["*/migrations/*", "*/tests/*"]
